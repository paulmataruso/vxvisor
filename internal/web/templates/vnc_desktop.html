{{define "vnc_desktop.html"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Desktop.Name}} — VXVisor Desktop</title>
<style>
 html,body{margin:0;height:100%;background:#000;color:#e7e9ee;font:14px system-ui,sans-serif}
 #bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#161922;border-bottom:1px solid #2a2f3c;flex-wrap:nowrap;overflow-x:auto}
 #bar a{color:#5b8cff;text-decoration:none;white-space:nowrap}
 #bar b{font-size:14px;white-space:nowrap}
 #status{color:#8b93a3;font-size:13px;white-space:nowrap;margin-left:auto}
 .cbtn{background:#222736;border:1px solid #2f3545;color:#e7e9ee;border-radius:7px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
 .cbtn:hover{border-color:#5b8cff}
 .cbtn:active{background:#2f3545}
 select.cbtn{height:30px}
 .sep{width:1px;height:24px;background:#2a2f3c;margin:0 2px}
 #wrap{position:absolute;top:46px;left:0;right:0;bottom:0;overflow:auto;background:#000}
 #screen{width:100%;height:100%}
</style></head><body>
<div id="bar">
  <a href="/" title="Back to My Desktops">←</a><b>{{.Desktop.Name}}</b>
  <span class="sep"></span>
  <button class="cbtn" id="k-cad" title="Ctrl+Alt+Del">Ctrl+Alt+Del</button>
  <span class="sep"></span>
  <select class="cbtn" id="k-disp" title="Display mode">
    <option value="auto" selected>Auto-resize to window</option>
    <option value="fit">Fit (scale to window)</option>
    <option value="actual">Actual size (scroll)</option>
  </select>
  <button class="cbtn" id="k-full" title="Fullscreen">⛶ Full</button>
  <span id="status">connecting…</span>
</div>
<div id="wrap"><div id="screen"></div></div>
<script type="module">
 import RFB from "/static/novnc/core/rfb.js";
 const status = document.getElementById("status");
 const scheme = location.protocol === "https:" ? "wss" : "ws";
 const token = {{.Token}};
 const url = `${scheme}://${location.host}/vnc/{{.Desktop.SessionID}}/ws` + (token ? ("?t=" + encodeURIComponent(token)) : "");
 let rfb;
 const screen = document.getElementById("screen");
 function grab(){ try { rfb && rfb.focus(); } catch(e){} }
 function applyDisplay(v){
   if(!rfb) return;
   screen.style.width = "100%"; screen.style.height = "100%";
   rfb.resizeSession = (v === "auto");
   rfb.scaleViewport = (v === "fit");
   rfb.clipViewport  = (v === "actual");
   try { window.dispatchEvent(new Event("resize")); } catch(e){}
   grab();
 }
 const DISP_KEY = "vdx_vdi_disp";
 function savedMode(){ try { return localStorage.getItem(DISP_KEY) || "auto"; } catch(e){ return "auto"; } }
 function saveMode(v){ try { localStorage.setItem(DISP_KEY, v); } catch(e){} }
 let connected = false, connecting = false, userClosed = false, reconnectTimer = null, backoff = 1000;
 (function(){ const sel=document.getElementById("k-disp"); if(sel) sel.value=savedMode(); })();
 function scheduleReconnect(){
   if(userClosed || reconnectTimer || connecting || connected) return;
   status.textContent = "reconnecting…";
   reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, backoff);
   backoff = Math.min(Math.round(backoff * 1.6), 8000);
 }
 function connect(){
   if(connecting || connected) return;
   if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
   connecting = true;
   let myRfb;
   try {
     myRfb = new RFB(screen, url, { credentials: { password: {{.Desktop.Password}} } });
     rfb = myRfb;
     rfb.resizeSession = true; rfb.scaleViewport = false; rfb.clipViewport = false; rfb.focusOnClick = true;
     myRfb.addEventListener("connect", () => {
       if(myRfb !== rfb) return;
       connecting = false; connected = true; backoff = 1000;
       status.textContent = "connected — click the screen to type";
       const v = savedMode();
       const sel = document.getElementById("k-disp"); if(sel) sel.value = v;
       applyDisplay(v); grab();
     });
     myRfb.addEventListener("disconnect", () => {
       if(myRfb !== rfb) return;
       connecting = false; connected = false;
       if(userClosed){ status.textContent = "disconnected"; return; }
       scheduleReconnect();
     });
   } catch (err) { connecting = false; status.textContent = "noVNC failed to load: " + err; scheduleReconnect(); }
 }
 connect();
 function onVisible(){
   if(document.visibilityState === "hidden") return;
   if(!connected && !connecting){ backoff = 1000; connect(); return; }
   if(connected){ applyDisplay(savedMode()); grab(); }
 }
 document.addEventListener("visibilitychange", onVisible);
 window.addEventListener("pageshow", onVisible);
 window.addEventListener("beforeunload", () => { userClosed = true; try { rfb && rfb.disconnect(); } catch(e){} });
 screen.addEventListener("mousedown", grab);
 screen.addEventListener("touchstart", grab, {passive:true});
 window.addEventListener("focus", grab);
 document.getElementById("k-cad").onclick = () => rfb && rfb.sendCtrlAltDel();
 document.getElementById("k-disp").onchange = (e) => { saveMode(e.target.value); applyDisplay(e.target.value); };
 document.getElementById("k-full").onclick = () => {
   const el = document.documentElement;
   if(!document.fullscreenElement){ el.requestFullscreen && el.requestFullscreen(); }
   else { document.exitFullscreen && document.exitFullscreen(); }
 };
</script></body></html>{{end}}
