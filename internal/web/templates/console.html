{{define "console.html"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console — {{.Session.Name}}</title>
<style>
 html,body{margin:0;height:100%;background:#000;color:#e7e9ee;font:14px system-ui,sans-serif}
 #bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#161922;border-bottom:1px solid #2a2f3c;flex-wrap:nowrap;overflow-x:auto}
 #bar a{color:#5b8cff;text-decoration:none;white-space:nowrap}
 #bar b{font-size:14px;white-space:nowrap}
 #status{color:#8b93a3;font-size:13px;white-space:nowrap;margin-left:auto}
 .cbtn{background:#222736;border:1px solid #2f3545;color:#e7e9ee;border-radius:7px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
 .cbtn:hover{border-color:#5b8cff}
 .cbtn:active{background:#2f3545}
 select.cbtn,input.cpaste{height:30px}
 .cpaste{background:#0e121a;border:1px solid #2f3545;color:#e7e9ee;border-radius:7px;padding:4px 8px;font:inherit;font-size:12px;width:150px}
 .sep{width:1px;height:24px;background:#2a2f3c;margin:0 2px}
 /* #wrap is the scroll area below the toolbar; #screen is the noVNC target and
    is sized by the display-mode logic (100% to fill, or an exact WxH). */
 #wrap{position:absolute;top:46px;left:0;right:0;bottom:0;overflow:auto;background:#000}
 #screen{width:100%;height:100%}
</style></head><body>
<div id="bar">
  <a href="/instances">←</a><b>{{.Session.Name}}</b>
  <span class="sep"></span>
  <select class="cbtn" id="k-tech" title="Switch console technology">
    <option value="/console/{{.Session.ID}}" selected>VNC (noVNC)</option>
    <option value="/desktop/{{.Session.ID}}">Desktop (RDP / VNC)</option>
    <option value="/console/{{.Session.ID}}/serial">Serial (text)</option>
  </select>
  <span class="sep"></span>
  <button class="cbtn" id="k-cad" title="Ctrl+Alt+Del">Ctrl+Alt+Del</button>
  <select class="cbtn" id="k-combo" title="Send a key combo">
    <option value="">Send key…</option>
    <option value="cab">Ctrl+Alt+Backspace</option>
    <option value="esc">Esc</option>
    <option value="tab">Tab</option>
    <option value="alttab">Alt+Tab</option>
    <option value="ctrlc">Ctrl+C</option>
    <option value="ctrlv">Ctrl+V</option>
    <option value="ctrlz">Ctrl+Z</option>
    <option value="super">Super (Win)</option>
    <option value="caf1">Ctrl+Alt+F1</option>
    <option value="caf2">Ctrl+Alt+F2</option>
    <option value="caf3">Ctrl+Alt+F3</option>
    <option value="caf7">Ctrl+Alt+F7</option>
  </select>
  <span class="sep"></span>
  <input class="cpaste" id="k-paste" placeholder="paste text → guest">
  <button class="cbtn" id="k-send">Send</button>
  <span class="sep"></span>
  <select class="cbtn" id="k-disp" title="Display mode / resolution">
    <optgroup label="Mode">
      <option value="auto" selected>Auto-resize to window</option>
      <option value="fit">Fit (scale to window)</option>
      <option value="actual">Actual size (scroll)</option>
    </optgroup>
    <optgroup label="Set guest resolution">
      <option value="1920x1080">1920 × 1080</option>
      <option value="1600x900">1600 × 900</option>
      <option value="1366x768">1366 × 768</option>
      <option value="1280x1024">1280 × 1024</option>
      <option value="1280x720">1280 × 720</option>
      <option value="1024x768">1024 × 768</option>
    </optgroup>
  </select>
  <select class="cbtn" id="k-qual" title="Console quality / responsiveness">
    <option value="auto" selected>Quality: Auto</option>
    <option value="snappy">Quality: Snappy (LAN)</option>
    <option value="balanced">Quality: Balanced</option>
    <option value="bandwidth">Quality: Bandwidth-saver</option>
  </select>
  <button class="cbtn" id="k-full" title="Fullscreen">⛶ Full</button>
  <span id="status">connecting…</span>
</div>
<div id="wrap"><div id="screen"></div></div>
<script type="module">
 import RFB from "/static/novnc/core/rfb.js";
 const status = document.getElementById("status");
 const scheme = location.protocol === "https:" ? "wss" : "ws";
 const url = `${scheme}://${location.host}/console/{{.Session.ID}}/ws`;
 // X keysyms
 const K = { ctrl:0xffe3, alt:0xffe9, shift:0xffe1, super:0xffeb, esc:0xff1b, tab:0xff09,
   bksp:0xff08, del:0xffff, f1:0xffbe, f2:0xffbf, f3:0xffc0, f7:0xffc4,
   c:0x0063, v:0x0076, z:0x007a };
 let rfb;
 const screen = document.getElementById("screen");
 // Keyboard capture needs the noVNC canvas to hold focus. A programmatic focus()
 // right after connect is often ignored by the browser (no user gesture), and
 // clicking a toolbar control moves focus off the canvas — so the guest stops
 // receiving keys ("can't type"). Refocus aggressively: on connect, on any click
 // in the screen area, and whenever the window/tab regains focus.
 function grab(){ try { rfb && rfb.focus(); } catch(e){} }
 function combo(...syms){ if(!rfb) return; grab();
   for(const s of syms) rfb.sendKey(s, null, true);
   for(let i=syms.length-1;i>=0;i--) rfb.sendKey(syms[i], null, false);
 }
 // Display modes. "auto" = remote resize: the guest framebuffer follows this
 // window (dynamic resize) — needs a guest GPU driver that honors ExtendedDesktop
 // Size (qxl/virtio-gpu + modesetting, like Proxmox's noVNC). "fit" scales the
 // guest display to the window without changing its resolution. "actual" shows it
 // 1:1 (scroll). A WxH value asks the guest to switch to exactly that resolution.
 function applyDisplay(v){
   if(!rfb) return;
   const m = /^(\d+)x(\d+)$/.exec(v);
   if(m){
     // Specific resolution: size the target to WxH and let noVNC request it.
     rfb.scaleViewport = false; rfb.clipViewport = false;
     screen.style.width = m[1]+"px"; screen.style.height = m[2]+"px";
     rfb.resizeSession = true;            // request the guest to match WxH
     status.textContent = "requested "+v+" (guest must support resize)";
   } else {
     screen.style.width = "100%"; screen.style.height = "100%";
     rfb.resizeSession = (v === "auto");
     rfb.scaleViewport = (v === "fit");
     rfb.clipViewport  = (v === "actual");
   }
   try { window.dispatchEvent(new Event("resize")); } catch(e){}
   grab();
 }
 // The chosen display mode persists across reloads and tab switches.
 const DISP_KEY = "vdx_console_disp";
 function savedMode(){ try { return localStorage.getItem(DISP_KEY) || "auto"; } catch(e){ return "auto"; } }
 function saveMode(v){ try { localStorage.setItem(DISP_KEY, v); } catch(e){} }
 // Console quality / responsiveness. Presets force a fixed quality/compression
 // trade-off; "Auto" measures the browser↔host round-trip and adapts (crisp +
 // near-zero CPU on a LAN, more compression as latency rises). Persisted per viewer.
 const QKEY = "vdx_console_qual";
 function savedQual(){ try { return localStorage.getItem(QKEY) || "auto"; } catch(e){ return "auto"; } }
 function saveQual(v){ try { localStorage.setItem(QKEY, v); } catch(e){} }
 function setQ(q,c){ if(rfb){ try { rfb.qualityLevel = q; rfb.compressionLevel = c; } catch(e){} } }
 function measureRTT(){
   // Three HEADs to a small static asset; take the minimum (least noisy sample).
   const probe = () => { const t = performance.now();
     return fetch('/static/novnc/core/rfb.js?_=' + Date.now() + Math.random(), {method:'HEAD', cache:'no-store'})
       .then(() => performance.now() - t).catch(() => 999); };
   return Promise.all([probe(), probe(), probe()]).then(a => Math.min.apply(null, a));
 }
 function applyQuality(mode){
   if(mode === 'snappy'){ setQ(9, 1); return; }
   if(mode === 'balanced'){ setQ(7, 5); return; }
   if(mode === 'bandwidth'){ setQ(5, 9); return; }
   // auto: adapt to measured round-trip latency.
   measureRTT().then(function(rtt){
     var q, c;
     if(rtt < 5){ q = 9; c = 2; }       // LAN / loopback — crisp, almost no CPU
     else if(rtt < 25){ q = 8; c = 4; }
     else if(rtt < 75){ q = 6; c = 6; }
     else { q = 5; c = 9; }             // high latency — spend CPU to save bytes
     setQ(q, c);
     try { var s = document.getElementById('k-qual'); if(s) s.options[0].text = 'Quality: Auto (' + Math.round(rtt) + 'ms)'; } catch(e){}
   });
 }
 let connected = false;
 let connecting = false;       // a connect() is in flight — don't stack another
 let userClosed = false;       // true only when WE intentionally tear down
 let reconnectTimer = null;
 let backoff = 1000;           // grows per failed attempt, reset on success
 // Reflect the saved mode in the dropdown immediately (before the first frame),
 // so the control always shows the remembered choice even mid-connect.
 (function(){ const sel=document.getElementById("k-disp"); if(sel) sel.value=savedMode(); })();
 function scheduleReconnect(){
   if(userClosed || reconnectTimer || connecting || connected) return;
   status.textContent = "reconnecting…";
   reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, backoff);
   backoff = Math.min(Math.round(backoff * 1.6), 8000);
 }
 function connect(){
   // Never run two connects at once — stacking RFB instances is what made the
   // screen flash (each teardown fired a disconnect that scheduled another).
   if(connecting || connected) return;
   if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
   connecting = true;
   let myRfb;
   try {
     myRfb = new RFB(screen, url,
       { credentials: { password: "{{.Session.VNCPassword}}" } });
     rfb = myRfb;                // the current instance
     rfb.resizeSession = true;   // default: dynamic resize to the window
     rfb.scaleViewport = false;
     rfb.clipViewport = false;
     rfb.focusOnClick = true;
     // Apply the chosen console quality (Auto measures round-trip latency and
     // adapts; the presets force a fixed trade-off). Set now so the initial
     // SetEncodings carries it.
     applyQuality(savedQual());
     myRfb.addEventListener("connect", () => {
       if(myRfb !== rfb) return; // a superseded instance — ignore its events
       connecting = false; connected = true;
       backoff = 1000;           // healthy again — reset the backoff
       status.textContent = "connected — click the screen to type";
       // Restore the user's saved display mode (e.g. "Fit") instead of resetting.
       const v = savedMode();
       const sel = document.getElementById("k-disp"); if(sel) sel.value = v;
       applyDisplay(v);
       grab();
     });
     myRfb.addEventListener("disconnect", e => {
       if(myRfb !== rfb) return; // not the current instance — don't reconnect
       connecting = false; connected = false;
       if(userClosed){ status.textContent = "disconnected"; return; }
       // Unexpected drop (idle teardown, half-open socket, VM blip): auto-reconnect
       // so the console doesn't just go black until a manual refresh.
       scheduleReconnect();
     });
     myRfb.addEventListener("clipboard", e => { /* guest copied; available if needed */ });
   } catch (err) { connecting = false; status.textContent = "noVNC failed to load: " + err; scheduleReconnect(); }
 }
 connect();
 // Returning to the tab: the canvas often comes back blank and the scaling resets.
 // Re-apply the saved mode (forces a repaint + rescale); if the socket dropped
 // while the tab was hidden, reconnect NOW instead of waiting out the backoff.
 function onVisible(){
   if(document.visibilityState === "hidden") return;
   if(!connected && !connecting){ backoff = 1000; connect(); return; }
   if(connected){ applyDisplay(savedMode()); grab(); }
 }
 document.addEventListener("visibilitychange", onVisible);
 window.addEventListener("pageshow", onVisible);
 window.addEventListener("beforeunload", () => { userClosed = true; try { rfb && rfb.disconnect(); } catch(e){} });
 // Click anywhere on the screen → focus the canvas so keystrokes reach the guest.
 screen.addEventListener("mousedown", grab);
 screen.addEventListener("touchstart", grab, {passive:true});
 window.addEventListener("focus", grab);

 // Switch console technology (navigate this tab to the chosen view).
 (function(){ var t=document.getElementById("k-tech"); if(t) t.onchange=(e)=>{ if(e.target.value) location.href=e.target.value; }; })();
 document.getElementById("k-cad").onclick = () => rfb && rfb.sendCtrlAltDel();
 document.getElementById("k-combo").onchange = (e) => {
   const v = e.target.value; e.target.value = "";
   switch(v){
     case "cab": combo(K.ctrl,K.alt,K.bksp); break;
     case "esc": combo(K.esc); break;
     case "tab": combo(K.tab); break;
     case "alttab": combo(K.alt,K.tab); break;
     case "ctrlc": combo(K.ctrl,K.c); break;
     case "ctrlv": combo(K.ctrl,K.v); break;
     case "ctrlz": combo(K.ctrl,K.z); break;
     case "super": combo(K.super); break;
     case "caf1": combo(K.ctrl,K.alt,K.f1); break;
     case "caf2": combo(K.ctrl,K.alt,K.f2); break;
     case "caf3": combo(K.ctrl,K.alt,K.f3); break;
     case "caf7": combo(K.ctrl,K.alt,K.f7); break;
   }
 };
 document.getElementById("k-send").onclick = () => {
   const inp = document.getElementById("k-paste");
   if(rfb && inp.value){ rfb.clipboardPasteFrom(inp.value); status.textContent = "sent to guest clipboard — paste in the guest"; }
 };
 document.getElementById("k-disp").onchange = (e) => { saveMode(e.target.value); applyDisplay(e.target.value); };
 (function(){ var q=document.getElementById("k-qual"); if(!q) return; q.value=savedQual();
   q.onchange = (e) => { saveQual(e.target.value); applyQuality(e.target.value); }; })();
 document.getElementById("k-full").onclick = () => {
   const el = document.documentElement;
   if(!document.fullscreenElement){ el.requestFullscreen && el.requestFullscreen(); }
   else { document.exitFullscreen && document.exitFullscreen(); }
 };
</script></body></html>{{end}}
