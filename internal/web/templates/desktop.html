{{define "desktop.html"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop — {{.Desktop.Name}}</title>
<style>
 html,body{margin:0;height:100%;background:#0b0d12;color:#e7e9ee;font:14px system-ui,sans-serif;overflow:hidden}
 #bar{height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#161922;border-bottom:1px solid #2a2f3c;position:relative;z-index:10}
 #bar a{color:#5b8cff;text-decoration:none}#bar b{font-size:14px}
 #status{color:#8b93a3;font-size:13px;margin-left:auto}
 .pill{font-size:11px;padding:2px 8px;border:1px solid #2a2f3c;border-radius:999px;color:#9aa3b2}
 #display{height:calc(100% - 44px);display:flex;align-items:center;justify-content:center}
 /* guacamole-common-js gives the base display layer z-index:-1 for its internal
    layer ordering. Without a containing stacking context that negative z-index
    escapes behind the page background, so the desktop renders invisibly (black
    screen with only the cursor). Isolate the guac container so its layer stack
    stays self-contained and the desktop is actually shown. */
 #display>div{isolation:isolate}
 #display canvas{outline:none;max-width:100%;max-height:100%}
</style></head><body>
<div id="bar">
  <a href="/instances/{{.Desktop.SessionID}}">← Instance</a>
  <b>{{.Desktop.Name}}</b>
  <select title="Switch console technology" onchange="if(this.value)location.href=this.value"
    style="background:#222736;border:1px solid #2f3545;color:#e7e9ee;border-radius:7px;padding:5px 8px;font:inherit;font-size:12px">
    <option value="/console/{{.Desktop.SessionID}}">VNC (noVNC)</option>
    <option value="/desktop/{{.Desktop.SessionID}}" selected>Desktop (VNC)</option>
    <option value="/console/{{.Desktop.SessionID}}/serial">Serial (text)</option>
  </select>
  <span class="pill">{{.Desktop.Protocol}}</span>
  <span class="pill" title="clipboard is shared over the VNC channel">clipboard</span>
  <button id="cad" title="Send Ctrl+Alt+Del — needed to unlock/sign in to a locked Windows session"
    style="background:#222736;border:1px solid #2f3545;color:#e7e9ee;border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer">Ctrl+Alt+Del</button>
  <span id="status">connecting…</span>
</div>
<div id="display" tabindex="0"></div>
<script type="module">
 // Full desktop in the browser via the guacd gateway. guacamole-common-js is
 // served from this origin (no CDN, no plugin). The WebSocket carries the
 // Guacamole protocol; the server completes the guacd handshake and relays.
 import Guacamole from "/static/guac/guacamole-common.min.js";

 const status = document.getElementById("status");
 const display = document.getElementById("display");
 const scheme = location.protocol === "https:" ? "wss" : "ws";
 const token = {{if .Token}}"{{.Token}}"{{else}}""{{end}};
 const base = `${scheme}://${location.host}/desktop/{{.Desktop.SessionID}}/ws`;

 // The active guac client, so toolbar actions (Ctrl+Alt+Del) can reach it.
 let activeClient = null;
 // X11 keysyms for the secure-attention sequence.
 const K_CTRL = 0xFFE3, K_ALT = 0xFFE9, K_DEL = 0xFFFF;
 document.getElementById("cad").addEventListener("click", () => {
   if (!activeClient) return;
   // press ctrl, alt, del — then release in reverse.
   [K_CTRL, K_ALT, K_DEL].forEach(k => activeClient.sendKeyEvent(1, k));
   [K_DEL, K_ALT, K_CTRL].forEach(k => activeClient.sendKeyEvent(0, k));
   display.focus();
 });

 function startConnect() {
   const url = base + (token ? ("?t=" + encodeURIComponent(token)) : "");

   const tunnel = new Guacamole.WebSocketTunnel(url);
   const client = new Guacamole.Client(tunnel);
   activeClient = client;
   display.appendChild(client.getDisplay().getElement());

   client.onstatechange = state => {
     status.textContent = ["idle","connecting…","waiting…","connected","closing…","disconnected"][state] || state;
   };
   client.onerror = e => { status.textContent = "error: " + (e && e.message ? e.message : e); };
   try { client.connect(); } catch (err) { status.textContent = "connect failed: " + err; }

   const mouse = new Guacamole.Mouse(client.getDisplay().getElement());
   mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = s => client.sendMouseState(s);
   const kbd = new Guacamole.Keyboard(document);
   kbd.onkeydown = k => client.sendKeyEvent(1, k);
   kbd.onkeyup   = k => client.sendKeyEvent(0, k);
   display.addEventListener("paste", ev => {
     const text = (ev.clipboardData || window.clipboardData).getData("text");
     if (!text) return;
     const stream = client.createClipboardStream("text/plain");
     const wr = new Guacamole.StringWriter(stream);
     wr.sendText(text); wr.sendEnd();
   });
   window.addEventListener("beforeunload", () => { try { client.disconnect(); } catch(e){} });
   display.focus();
 }

 startConnect();
</script></body></html>{{end}}
